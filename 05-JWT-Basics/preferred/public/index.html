<!doctype html>
<html>
<head><meta charset="utf-8"><title>JWT Demo</title></head>
<body>
  <h1>Login</h1>
  <input id="name" placeholder="name">
  <input id="password" placeholder="password" type="password">
  <button id="login">Log in</button>

  <h2>Protected</h2>
  <button id="hello">Get Hello</button>
  <pre id="out"></pre>

  <script>
    let token = null;
    document.getElementById('login').onclick = async () => {
      const name = document.getElementById('name').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/v1/logon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password })
      });
      const j = await res.json();
      token = j.token;
      document.getElementById('out').textContent = 'Login successful';
    };
    document.getElementById('hello').onclick = async () => {
      const res = await fetch('/api/v1/hello', {
        headers: { 'Authorization': 'Bearer ' + (token || '') }
      });
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
